<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blurix | Pak Studies CIE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark"> <div class="app-container">
        <header class="header">
            <div class="logo">BLURIX<span>.STUDY</span></div>
            <button id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">🌙</button>
        </header>

        <nav class="tabs-container">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('how', this)">Writing</button>
                <button class="tab" onclick="switchTab('s1', this)">Sec 1</button>
                <button class="tab" onclick="switchTab('s2', this)">Sec 2</button>
                <button class="tab" onclick="switchTab('s3', this)">Sec 3</button>
                <button class="tab" onclick="switchTab('practice', this)">Practice</button>
            </div>
        </nav>

        <main class="content">
            <section id="panel-how" class="panel active">
                <div class="section-label">CIE Exam Strategy</div>
                <div class="info-card">
                    <h4>Paper Structure</h4>
                    <p>Sec A: 25m (Compulsory) | Sec B: 50m (2 of 4)</p>
                </div>
                <div class="tip-box">
                    <strong>Developed Point:</strong> Fact + Reason + Impact. Minimum 5-6 lines per point.
                </div>
                <div class="info-card">
                    <h4>Level 5 (14 Marks)</h4>
                    <p>Intro + 3 DPs (Side A) + 3 DPs (Side B) + Evaluation (Fresh Reason).</p>
                </div>
            </section>

            <section id="panel-s1" class="panel">
                <input type="text" class="search-bar" placeholder="Search Section 1..." onkeyup="filterTopics('s1', this.value)">
                <div id="s1-topics-list" class="topics-grid"></div>
            </section>

            <section id="panel-s2" class="panel">
                <input type="text" class="search-bar" placeholder="Search Section 2..." onkeyup="filterTopics('s2', this.value)">
                <div id="s2-topics-list" class="topics-grid"></div>
            </section>

            <section id="panel-s3" class="panel">
                <input type="text" class="search-bar" placeholder="Search Section 3..." onkeyup="filterTopics('s3', this.value)">
                <div id="s3-topics-list" class="topics-grid"></div>
            </section>

            <section id="panel-practice" class="panel">
                <div class="section-label">Model Answers</div>
                <div id="practice-list"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
