<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX404 | FULL 55-CHAPTER ARCHIVE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="mesh-bg"></div>
    <div class="glass-shell">
        <header class="header">
            <h1 class="logo">MATRIX404<span>.HIST</span></h1>
            <nav class="nav">
                <button class="nav-btn active" onclick="showTab('ops', this)">EXAM OPS</button>
                <button class="nav-btn" onclick="showTab('db', this)">DATABASE</button>
                <button class="nav-btn" onclick="showTab('drill', this)">DRILLS</button>
            </nav>
        </header>

        <main class="content-area">
            <section id="panel-ops" class="panel active">
                <div class="card glass">
                    <span class="tag">LEVEL 5 METHOD</span>
                    <h2>The 14-Mark Protocol</h2>
                    <p>Follow the <strong>3-3-1 Rule</strong> for Level 5 (13-14 Marks):</p>
                    <div class="rule-box">
                        <div class="rule"><span>3 DP</span> Given Reason</div>
                        <div class="rule"><span>3 DP</span> Other Reasons</div>
                        <div class="rule"><span>1 DP</span> Fresh Eval</div>
                    </div>
                </div>
                <div class="card glass">
                    <h3>Paper Pattern (2059/01)</h3>
                    <ul class="pattern-list">
                        <li><strong>Section A:</strong> Compulsory (3-5-7-10 structure)</li>
                        <li><strong>Section B:</strong> Choose 2 of 4 (4-7-14 structure)</li>
                    </ul>
                </div>
            </section>

            <section id="panel-db" class="panel">
                <input type="text" id="search" placeholder="Search 55 Chapters..." onkeyup="search()">
                <div class="filter-bar">
                    <button class="f-btn active" onclick="filterSec('s1', this)">SEC 1</button>
                    <button class="f-btn" onclick="filterSec('s2', this)">SEC 2</button>
                    <button class="f-btn" onclick="filterSec('s3', this)">SEC 3</button>
                    <button class="f-btn" onclick="filterSec('fr', this)">RELATIONS</button>
                </div>
                <div id="db-render"></div>
            </section>

            <section id="panel-drill" class="panel">
                <div id="drill-render"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
