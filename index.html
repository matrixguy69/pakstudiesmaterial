<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX404 | 2059 GUIDE</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mesh-bg"></div>
    <div class="glass-shell">
        <header class="header">
            <div class="brand">MATRIX<span>404</span></div>
            <nav class="nav">
                <button class="nav-btn active" onclick="showTab('ops', this)">EXAM OPS</button>
                <button class="nav-btn" onclick="showTab('db', this)">DATABASE</button>
                <button class="nav-btn" onclick="showTab('drill', this)">PRACTICE</button>
            </nav>
        </header>

        <main class="viewport">
            <section id="tab-ops" class="panel active">
                <div class="card glass">
                    <span class="badge">L5 PROTOCOL</span>
                    <h2>The 14-Mark Blueprint</h2>
                    <div class="formula">3 DP (GIVEN) + 3 DP (OTHERS) + 1 EVAL = 14/14</div>
                    <div class="step-box">
                        <p><strong>Rule 1:</strong> Never list. Every point must explain WHY and the IMPACT.</p>
                        <p><strong>Rule 2:</strong> Evaluation must be a <em>new</em> perspective, not a summary.</p>
                    </div>
                </div>
            </section>

            <section id="tab-db" class="panel">
                <div class="controls">
                    <input type="text" id="search" placeholder="Search 55 Chapters..." onkeyup="search()">
                    <div class="filter-bar">
                        <button class="f-pill active" onclick="filter('s1', this)">SEC 1</button>
                        <button class="f-pill" onclick="filter('s2', this)">SEC 2</button>
                        <button class="f-pill" onclick="filter('s3', this)">SEC 3</button>
                        <button class="f-pill" onclick="filter('fr', this)">RELATIONS</button>
                    </div>
                </div>
                <div id="db-render"></div>
            </section>

            <section id="tab-drill" class="panel">
                <div class="vault-header">
                    <h3>50+ Past Paper Questions</h3>
                    <p>Exam Patterns 2002–2025</p>
                </div>
                <div id="drill-render"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
