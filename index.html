<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX 404 | COMPLETE 55-CHAPTER ARCHIVE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="mesh-bg"></div>
    <div class="glass-shell">
        <header class="header">
            <div class="brand">MATRIX<span>404</span></div>
            <nav class="nav">
                <button class="nav-btn active" onclick="switchTab('ops', this)">EXAM OPS</button>
                <button class="nav-btn" onclick="switchTab('db', this)">DATABASE</button>
                <button class="nav-btn" onclick="switchTab('drill', this)">PRACTICE</button>
            </nav>
        </header>

        <main class="viewport">
            <section id="tab-ops" class="panel active">
                <div class="card glass">
                    <span class="badge">14-MARKER STRATEGY</span>
                    <h2>The "3-3-1" Execution</h2>
                    <div class="formula">FACT + REASON + IMPACT = L5 ANSWER</div>
                    <div class="step-list">
                        <div class="step">1. Three DPs for the factor in the question.</div>
                        <div class="step">2. Three DPs for other relevant factors.</div>
                        <div class="step">3. Evaluation: A unique 7th point + Final Verdict.</div>
                    </div>
                </div>
            </section>

            <section id="tab-db" class="panel">
                <div class="controls">
                    <input type="text" id="search" placeholder="Search 55 Chapters..." onkeyup="search()">
                    <div class="filter-bar">
                        <button class="f-pill active" onclick="filter('s1', this)">SEC 1</button>
                        <button class="f-pill" onclick="filter('s2', this)">SEC 2</button>
                        <button class="f-pill" onclick="filter('s3', this)">SEC 3</button>
                        <button class="f-pill" onclick="filter('fr', this)">RELATIONS</button>
                    </div>
                </div>
                <div id="db-render"></div>
            </section>

            <section id="tab-drill" class="panel">
                <div class="vault-header">
                    <h3>Practice Vault (2002-2025)</h3>
                    <p>50+ Questions with Mark Scheme Logic</p>
                </div>
                <div id="drill-render"></div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
